name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug
      - name: Commit APK back to repo
        run: |
          mkdir -p app/release
          cp app/build/outputs/apk/debug/*.apk app/release/yinpagi-ears.apk
          git config user.email "eta@local"
          git config user.name "Eta"
          git add app/release/yinpagi-ears.apk
          git commit -m "CI: publish debug APK" || echo "no change"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
