name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug
      - name: Publish APK as base64 in repo
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          mkdir -p app/release
          base64 -w0 "$APK" > app/release/yinpagi-ears.apk.b64
          git config user.email "eta@local"
          git config user.name "Eta"
          git add app/release/yinpagi-ears.apk.b64
          git commit -m "CI: publish APK (fixed signature)" || echo "no change"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true
